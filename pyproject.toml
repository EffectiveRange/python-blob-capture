[project]
name = "python-blob-capture"
description = "A Python library for capturing and storing data into BLOBs efficiently"
authors = [
    { name = "Ferenc Nandor Janky & Attila Gombos", email = "info@effective-range.com" }
]
maintainers = [
    { name = "Ferenc Nandor Janky & Attila Gombos", email = "info@effective-range.com" }
]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "python-context-logger @ git+https://github.com/EffectiveRange/python-context-logger.git@latest",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "mypy",
    "flake8",
    "pytest-cov",
]

[project.scripts]
er-blob-extract = "blob_capture.capture:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["blob_capture"]

[tool.setuptools.package-data]
blob_capture = ["py.typed"]

[build-system]
requires = ["setuptools>=61", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = ["--verbose", "--capture=no"]
python_files = ["*Test.py"]
python_classes = ["*Test"]
